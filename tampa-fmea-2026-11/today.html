<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Today · Tampa — FMEA Energy Connections</title>
<style>
  :root {
    --bg: #0a0a0a; --card: #141414; --border: #222;
    --text: #e0e0e0; --dim: #888; --accent: #ff6a00;
    --green: #2ecc71; --red: #e74c3c; --blue: #3498db;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    max-width: 480px; margin: 0 auto; padding: 16px 16px 40px;
    -webkit-text-size-adjust: 100%;
  }
  .header { text-align: center; padding: 16px 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .header .day-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 700; }
  .header h1 { font-size: 1.3rem; font-weight: 700; margin: 4px 0; }
  .header .date { color: var(--dim); font-size: 0.85rem; }
  .status-bar { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .status-pill { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 0.72rem; white-space: nowrap; flex-shrink: 0; }
  .status-pill.good { border-color: var(--green); color: var(--green); }
  .status-pill.warn { border-color: var(--accent); color: var(--accent); }
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .section h2 { font-size: 0.95rem; margin-bottom: 8px; }
  .weather-row { display: flex; gap: 8px; overflow-x: auto; }
  .weather-day { background: var(--bg); border-radius: 8px; padding: 8px 12px; text-align: center; min-width: 80px; flex-shrink: 0; }
  .weather-day .day { font-size: 0.65rem; color: var(--dim); text-transform: uppercase; }
  .weather-day .hi { font-weight: 700; font-size: 1.1rem; }
  .weather-day .lo { font-size: 0.7rem; color: var(--dim); }
  .weather-day .rain { font-size: 0.65rem; color: var(--blue); }
  .event { padding: 8px 10px; background: var(--bg); border-radius: 6px; margin-bottom: 4px; font-size: 0.85rem; }
  .event .time { font-weight: 600; color: var(--accent); }
  .rec-card { padding: 10px; background: var(--bg); border-radius: 8px; margin-bottom: 6px; position: relative; }
  .rec-card .name { font-weight: 600; }
  .rec-card .meta { font-size: 0.72rem; color: var(--dim); margin-top: 2px; }
  .tip { font-size: 0.8rem; padding: 8px 12px; background: rgba(52,152,219,0.08); border-radius: 8px; margin-bottom: 6px; }
  .tip strong { color: var(--blue); }
  .warn-tip { font-size: 0.8rem; padding: 8px 12px; background: rgba(255,106,0,0.08); border-radius: 8px; margin-bottom: 6px; }
  .warn-tip strong { color: var(--accent); }
  .thumbs { display: flex; gap: 4px; margin-top: 6px; }
  .thumbs button {
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    color: var(--dim); font-size: 0.85rem; padding: 2px 6px; cursor: pointer;
    transition: all 0.15s;
  }
  .thumbs button:hover { border-color: var(--accent); }
  .thumbs button.voted-up { background: rgba(46,204,113,0.15); border-color: var(--green); color: var(--green); }
  .thumbs button.voted-down { background: rgba(231,76,60,0.15); border-color: var(--red); color: var(--red); }
  .footer { text-align: center; font-size: 0.65rem; color: var(--dim); margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .footer a { color: var(--accent); }
  .day-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
  .day-tabs button { flex: 0 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 9px; color: var(--text); font-size: 0.74rem; font-weight: 600; padding: 8px 11px; cursor: pointer; line-height: 1.25; text-align: center; -webkit-tap-highlight-color: transparent; }
  .day-tabs button small { display: block; color: var(--dim); font-weight: 400; font-size: 0.66rem; }
  .day-tabs button.on { border-color: var(--accent); background: rgba(255,106,0,.12); color: var(--accent); }
  .weather-day { cursor: pointer; }
</style>

<link rel="stylesheet" href="/atlas-light.css">
<style id="atlas-tint">:root{--hero1:#34C759;--hero2:#30B0C7;--accent:#248A3D}</style>
</head>
<body>

<div class="header">
  <div class="day-label" id="day-label">Loading...</div>
  <h1>Tampa — FMEA Energy Connections</h1>
  <div class="date" id="day-date"></div>
</div>

<div class="day-tabs" id="day-tabs"></div>

<div class="status-bar" id="status-bar"></div>

<div class="section" id="warn-section" style="display:none">
  <div class="warn-tip" id="warn-content"></div>
</div>

<div class="section" id="weather-section">
  <h2>🌤️ Weather <span style="font-size:0.65rem;color:var(--dim);font-weight:400">· seasonal normals until T-7</span></h2>
  <div class="weather-row" id="weather-content"></div>
</div>

<div class="section" id="timeline-section">
  <h2>📅 Today</h2>
  <div id="timeline-content"></div>
</div>

<div class="section" id="food-section">
  <h2>🥩 Eat &amp; Drink</h2>
  <div id="food-content"></div>
</div>

<div class="section" id="transit-section" style="display:none">
  <h2>🚊 Getting Around</h2>
  <div id="transit-content"></div>
</div>

<div class="section" id="tip-section">
  <h2>💡 Atlas's Tip</h2>
  <div class="tip" id="tip-content"></div>
</div>

<div class="footer">
  Atlas Travel Concierge · <a href="index.html">📍 Full Briefing</a> · <a href="https://jarvisdanley.github.io">🏠 All Trips</a>
</div>

<script>
var TRIP = {
  start: '2026-11-02',
  end: '2026-11-03',
  complete: true,
  days: [
    {
      date: '2026-11-03',
      label: '✅ Trip complete · Nov 2–3, 2026',
      weather: { hi: 82, lo: 74, icon: '✅', rain: 0 },
      pills: [
        { text: '✅ Spoke Nov 3 · 10:15 AM ET', cls: 'good' },
        { text: '✈️ Home 4:05 PM CT', cls: 'good' },
        { text: '💰 Expense open', cls: 'warn' }
      ],
      warn: '<strong>Four expense lines left:</strong> the Grand Hyatt folio total (the PDF did not survive the forward), MCI parking days, the mileage text entry, and the Rocky Point transfers.',
      timeline: [
        { time: 'Mon Nov 2', text: '✈️ WN 1369 MCI 2:40 PM → TPA 6:10 PM EST · 🏨 Grand Hyatt Tampa Bay, 1 night · 🥩 Charley\u2019s Steak House $150.72 (logged)' },
        { time: 'Tue Nov 3', text: '🎤 FMEA Energy Connections — spoke 10:15–11:00 AM ET · ✈️ WN 4966 TPA 2:10 PM → MCI 4:05 PM CT' }
      ],
      transit: [
        'TPA ↔ Rocky Point (Grand Hyatt): ~10–15 min by cab/rideshare, ~4 mi',
        'Grand Hyatt → Oystercatchers: inside the hotel · Charley\u2019s: ~15 min north'
      ],
      tip: 'Both legs flew, the hotel ran one night, and the session window was the dry part of the day — no rebook, no delay cost. The only loose end is paper: re-forward the Hyatt folio PDF (or just send the total and card last-4) and the report closes. The Metallica Meet &amp; Greet contest closed while you were travelling and no winner email came — that thread is finished.',
      food: [
        { name: 'Charley\u2019s Steak House', url: 'https://www.charleyssteakhouse.com/', meta: '📍 Tampa · Woodsby family, locally owned · the dinner that happened · $150.72 logged', id: 'today-tpa-charleys' },
        { name: 'Oystercatchers', url: 'https://www.oystercatchersrestaurant.com/', meta: '📍 2900 Bayport Dr, inside the Grand Hyatt · ranked #1, went unbooked and it did not matter', id: 'today-tpa-oystercatchers' },
        { name: 'Rusty Pelican', url: 'https://www.rustypelican.com/', meta: '📍 2425 N Rocky Point Dr · waterfront, ~1 min from the hotel', id: 'today-tpa-rusty' }
      ]
    }
  ]
};

function getToday() {
  var now = new Date();
  var tripStart = new Date(TRIP.start + 'T00:00:00-05:00');
  var tripEnd = new Date(TRIP.end + 'T23:59:59-05:00');

  if (now < tripStart) {
    return { day: TRIP.days[0], idx: 0, mode: 'pre-trip' };
  }
  if (now > tripEnd) {
    return { day: TRIP.days[TRIP.days.length-1], idx: TRIP.days.length-1, mode: 'post-trip' };
  }

  for (var i = 0; i < TRIP.days.length; i++) {
    var dayStart = new Date(TRIP.days[i].date + 'T00:00:00-05:00');
    var dayEnd = new Date(TRIP.days[i].date + 'T23:59:59-05:00');
    if (now >= dayStart && now <= dayEnd) {
      return { day: TRIP.days[i], idx: i, mode: 'active' };
    }
  }

  return { day: TRIP.days[0], idx: 0, mode: 'pre-trip' };
}

function render(d) {
  var day = d || getToday().day;
  var mode = d ? 'active' : getToday().mode;

  document.getElementById('day-label').textContent = mode === 'pre-trip' ? 'NEXT UP · ' + day.label : day.label;
  document.getElementById('day-date').textContent = day.date;

  var pills = '';
  (day.pills || []).forEach(function(p) {
    pills += '<span class="status-pill ' + p.cls + '">' + p.text + '</span>';
  });
  document.getElementById('status-bar').innerHTML = pills;

  if (day.warn) {
    document.getElementById('warn-content').innerHTML = day.warn;
    document.getElementById('warn-section').style.display = '';
  } else {
    document.getElementById('warn-section').style.display = 'none';
  }

  var weatherRows = '';
  TRIP.days.forEach(function(dd) {
    var active = dd.date === day.date ? ' style="border:1px solid var(--accent)"' : '';
    weatherRows += '<div class="weather-day"' + active + '>' +
      '<div class="day">' + new Date(dd.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) + '</div>' +
      '<div class="hi">' + dd.weather.hi + '°F</div>' +
      '<div class="lo">' + dd.weather.lo + '°F</div>' +
      '<div class="rain">' + dd.weather.icon + ' ' + dd.weather.rain + '%</div>' +
    '</div>';
  });
  document.getElementById('weather-content').innerHTML = weatherRows;

  var timeline = '';
  (day.timeline || []).forEach(function(e) {
    timeline += '<div class="event"><span class="time">' + e.time + '</span> ' + e.text + '</div>';
  });
  document.getElementById('timeline-content').innerHTML = timeline;

  var food = '';
  (day.food || []).forEach(function(f) {
    var nameHtml = f.url
      ? '<a href="' + f.url + '" style="color:inherit;text-decoration:none" target="_blank">' + f.name + '</a>'
      : f.name;
    food += '<div class="rec-card">' +
      '<div class="name">' + nameHtml + '</div>' +
      '<div class="meta">' + f.meta + '</div>' +
      '<div class="thumbs"><button onclick="vote(\''+f.id+'\',\'up\',this)" title="Loved it">👍</button><button onclick="vote(\''+f.id+'\',\'down\',this)" title="Not for me">👎</button></div>' +
    '</div>';
  });
  document.getElementById('food-content').innerHTML = food;

  if (day.transit) {
    var transit = '';
    day.transit.forEach(function(x) {
      transit += '<div class="event">' + x + '</div>';
    });
    document.getElementById('transit-content').innerHTML = transit;
    document.getElementById('transit-section').style.display = '';
  } else {
    document.getElementById('transit-section').style.display = 'none';
  }

  document.getElementById('tip-content').innerHTML = day.tip;
}

function vote(id, dir, btn) {
  var key = 'atlas_vote_' + id;
  var current = localStorage.getItem(key);
  var data = current ? JSON.parse(current) : {up:0, down:0, voted: null};
  var container = btn.parentElement;
  var upBtn = container.children[0];
  var downBtn = container.children[1];
  if (data.voted === dir) {
    data[dir] = Math.max(0, data[dir] - 1);
    data.voted = null;
    upBtn.classList.remove('voted-up');
    downBtn.classList.remove('voted-down');
  } else {
    if (data.voted) { data[data.voted] = Math.max(0, data[data.voted] - 1); }
    data[dir] = (data[dir] || 0) + 1;
    data.voted = dir;
    upBtn.classList.toggle('voted-up', dir === 'up');
    downBtn.classList.toggle('voted-down', dir === 'down');
  }
  localStorage.setItem(key, JSON.stringify(data));
}

(function(){
  document.querySelectorAll('.thumbs').forEach(function(el){
    var btn = el.querySelector('button');
    if (!btn) return;
    var match = btn.getAttribute('onclick').match(/vote\('([^']+)'/);
    if (!match) return;
    var id = match[1];
    var data = JSON.parse(localStorage.getItem('atlas_vote_' + id) || '{"up":0,"down":0,"voted":null}');
    if (data.voted === 'up') el.children[0].classList.add('voted-up');
    if (data.voted === 'down') el.children[1].classList.add('voted-down');
  });
})();

render();
</script>

<script>
/* Atlas day picker: tap a day tab (or a weather card) to view that day */
(function () {
  var bar = document.getElementById('day-tabs');
  if (!bar || typeof TRIP === 'undefined') return;
  function show(i) {
    render(TRIP.days[i]);
    [].forEach.call(bar.children, function (b, j) { b.classList.toggle('on', j === i); });
    var b = bar.children[i]; if (b && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
  TRIP.days.forEach(function (d, i) {
    var dt = new Date(d.date + 'T12:00:00');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.innerHTML = dt.toLocaleDateString('en-US', { weekday: 'short' }) + '<small>' + dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</small>';
    btn.addEventListener('click', function () { show(i); });
    bar.appendChild(btn);
  });
  var t = getToday(); var start = Math.max(0, TRIP.days.indexOf(t.day));
  [].forEach.call(bar.children, function (b, j) { b.classList.toggle('on', j === start); });
  document.addEventListener('click', function (ev) {
    var w = ev.target.closest && ev.target.closest('.weather-day');
    if (!w || !w.parentElement) return;
    var i = [].indexOf.call(w.parentElement.children, w);
    if (i >= 0 && i < TRIP.days.length) show(i);
  });
})();
</script>
</body>
</html>
