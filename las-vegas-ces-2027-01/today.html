/* page layer · mobile-native (skill: mobile-native). Shared fixes live in /atlas-light.css. */
*{box-sizing:border-box}

/* Day chips + weather: native horizontal scroll with snap; contain so an edge swipe does not navigate back. */
.hscroll{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;overscroll-behavior-x:contain;

.status-bar{flex-wrap:nowrap}

.weather-day{min-width:88px;padding:10px 12px;text-align:center;cursor:pointer;-webkit-user-select:none;user-select:none}
.weather-day .day{font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.weather-day .hi{font-size:20px;font-weight:700}
.weather-day .lo,.weather-day .rain{font-size:12px}
.weather-day.pending .hi{opacity:.45}
.event{display:flex;gap:10px}
.event .time{flex:0 0 74px;font-weight:600;font-size:13px}
.rec-card .name{font-size:15px;font-weight:600}
.rec-card .meta{font-size:12px;margin-top:4px}
.thumbs{display:flex;gap:8px;margin-top:10px}
.thumbs button{min-height:36px;min-width:52px;font-size:16px;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 12px;margin-top:8px;background:var(--accent);

.row:active{transform:scale(.98);transition-duration:0s}
.row b{flex:1;font-size:15px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;justify-content:center;

  background:rgba(233,233,239,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid rgba(0,0,0,.08)}
.dock a{flex:1 1 0;max-width:180px;min-height:44px;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--text);
  border:1px solid rgba(0,0,0,.08);border-radius:14px;font-size:14px;font-weight:600;text-decoration:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform 120ms cubic-bezier(.2,.8,.2,1)}
.dock a.primary{background:var(--accent);color:#fff;border-color:transparent}
.dock a:active{transform:scale(.96);opacity:.85;transition-duration:0s}
body.has-dock{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))!important}
@media (hover:hover) and (pointer:fine){

}
@media (prefers-reduced-motion:reduce){.day-tabs button,.row,.dock a{transition:none}}

function getToday() {
  var now = new Date();
  var start = new Date(TRIP.start + 'T00:00:00' + TRIP.tz), end = new Date(TRIP.end + 'T23:59:59' + TRIP.tz);
  if (now < start) return { day: TRIP.days[0], idx: 0, mode: 'pre-trip' };
  if (now > end) return { day: TRIP.days[TRIP.days.length - 1], idx: TRIP.days.length - 1, mode: 'post-trip' };
  for (var i = 0; i < TRIP.days.length; i++) {
    var a = new Date(TRIP.days[i].date + 'T00:00:00' + TRIP.tz), b = new Date(TRIP.days[i].date + 'T23:59:59' + TRIP.tz);
    if (now >= a && now <= b) return { day: TRIP.days[i], idx: i, mode: 'active' };
  }
  return { day: TRIP.days[0], idx: 0, mode: 'pre-trip' };
}

function fmt(d) { return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }); }

function render(i, mode) {
  var day = TRIP.days[i];
  document.getElementById('day-label').textContent = (mode === 'pre-trip' ? 'NEXT UP · ' : '') + day.label.toUpperCase();
  document.getElementById('day-date').textContent = fmt(day.date) + ' · Pacific time';

  document.getElementById('status-bar').innerHTML = (day.pills || []).map(function (p) {
    return '<span class="status-pill ' + (p.cls || '') + '">' + p.text + '</span>'; }).join('');

  var ws = document.getElementById('warn-section');
  if (day.warn) { document.getElementById('warn-content').innerHTML = day.warn; ws.style.display = ''; } else { ws.style.display = 'none'; }

  document.getElementById('weather-content').innerHTML = TRIP.days.map(function (dd, j) {
    var w = dd.weather, pend = w.hi === null || w.normal;
    return '<div class="weather-day' + (j === i ? ' on' : '') + (pend ? ' pending' : '') + '" data-i="' + j + '">' +
      '<div class="day">' + new Date(dd.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' }) + '</div>' +
      '<div class="hi">' + (w.hi === null ? '–' : (w.normal ? '~' : '') + w.hi + '°F') + '</div>' +
      '<div class="lo">' + (w.hi === null ? 'Dec 29' : 'low ' + (w.normal ? '~' : '') + w.lo + '°F') + '</div>' +
      '<div class="rain">' + w.icon + (w.normal ? ' normal' : (pend ? '' : ' ' + w.rain + '%')) + '</div></div>';
  }).join('');

  document.getElementById('timeline-content').innerHTML = (day.timeline || []).map(function (e) {
    return '<div class="event"><span class="time">' + e.time + '</span><span>' + e.text + '</span></div>'; }).join('');

  var ts = document.getElementById('transit-section');
  if (day.transit || day.rides) {
    document.getElementById('transit-content').innerHTML =
      (day.transit || []).map(function (x) { return '<div class="event">' + x + '</div>'; }).join('') +
      (day.rides || []).map(function (r) { return '<a class="row" href="' + r.url + '" target="_blank" rel="noopener"><span>🚗</span><b>' + r.label + '</b><span>›</span></a>'; }).join('');
    ts.style.display = '';
  } else { ts.style.display = 'none'; }

  document.getElementById('food-content').innerHTML = (day.food || []).map(function (f) {
    return '<div class="rec-card" data-feedback-id="' + f.id + '"><div class="name"><a href="' + f.url + '" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">' + f.name + '</a></div>' +
      '<div class="meta">' + f.meta + '</div>' +
      '<div class="thumbs"><button type="button" onclick="vote(\'' + f.id + '\',\'up\',this)" aria-label="Thumbs up">👍</button><button type="button" onclick="vote(\'' + f.id + '\',\'down\',this)" aria-label="Thumbs down">👎</button></div></div>';
  }).join('');
  restoreVotes();

  document.getElementById('tip-content').innerHTML = day.tip;

  [].forEach.call(document.getElementById('day-tabs').children, function (b, j) {
    b.classList.toggle('on', j === i); b.setAttribute('aria-selected', j === i ? 'true' : 'false'); });
}

function vote(id, dir, btn) {
  var key = 'atlas_vote_' + id;
  var data = JSON.parse(localStorage.getItem(key) || '{"up":0,"down":0,"voted":null}');
  var box = btn.parentElement, up = box.children[0], down = box.children[1];
  if (data.voted === dir) { data[dir] = Math.max(0, data[dir] - 1); data.voted = null; up.classList.remove('voted-up'); down.classList.remove('voted-down'); }
  else { if (data.voted) data[data.voted] = Math.max(0, data[data.voted] - 1); data[dir] = (data[dir] || 0) + 1; data.voted = dir;
    up.classList.toggle('voted-up', dir === 'up'); down.classList.toggle('voted-down', dir === 'down'); }
  localStorage.setItem(key, JSON.stringify(data));
}
function restoreVotes() {
  document.querySelectorAll('.thumbs').forEach(function (el) {
    var m = el.querySelector('button').getAttribute('onclick').match(/vote\('([^']+)'/); if (!m) return;
    var d = JSON.parse(localStorage.getItem('atlas_vote_' + m[1]) || '{"voted":null}');
    if (d.voted === 'up') el.children[0].classList.add('voted-up');
    if (d.voted === 'down') el.children[1].classList.add('voted-down');
  });
}

(function () {
  var bar = document.getElementById('day-tabs');
  TRIP.days.forEach(function (d, i) {
    var dt = new Date(d.date + 'T12:00:00'), b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'tab');
    b.innerHTML = dt.toLocaleDateString('en-US', { weekday: 'short' }) + '<small>' + dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</small>';
    /* Press feedback comes from :active (instant on touch-down); click does the work so keyboard still works. */
    b.addEventListener('click', function () { render(i, 'active'); if (b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' }); });
    bar.appendChild(b);
  });
  document.getElementById('weather-content').addEventListener('click', function (ev) {
    var w = ev.target.closest('.weather-day'); if (w) render(+w.getAttribute('data-i'), 'active');
  });
  var t = getToday();
  render(t.idx, t.mode);
})();
</script>
